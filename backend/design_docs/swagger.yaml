openapi: 3.0.3
info:
  title: STEPQ API
  version: 1.0
  description: STEPQ API 仕様定義書（完全版 / 日本語）

servers:
  - url: https://api.stepq.example.com

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: "uuid-1234"
        email:
          type: string
          example: "user@example.com"
        name:
          type: string
          example: "Taro"
      required:
        - id
        - email
        - name

    QGroup:
      type: object
      properties:
        id:
          type: string
          example: "uuid-5678"
        title:
          type: string
          example: "数学"
        passphrase:
          type: string
          example: "abc123"
      required:
        - id
        - title
        - passphrase

    Question:
      type: object
      properties:
        id:
          type: string
          example: "uuid-1111"
        qgroupId:
          type: string
          example: "uuid-5678"
        index:
          type: integer
          example: 3
        text:
          type: string
          example: "次の計算をせよ"
      required:
        - id
        - qgroupId
        - index
        - text

    Trial:
      type: object
      properties:
        id:
          type: string
          example: "uuid-2222"
        qgroupId:
          type: string
          example: "uuid-5678"
        userId:
          type: string
          example: "uuid-1234"
        index:
          type: integer
          example: 1
        startTime:
          type: string
          format: date-time
          example: "2024-01-01T10:00:00Z"
      required:
        - id
        - qgroupId
        - userId
        - index
        - startTime

    Answer:
      type: object
      properties:
        id:
          type: string
          example: "uuid-3333"
        trialId:
          type: string
          example: "uuid-2222"
        questionId:
          type: string
          example: "uuid-1111"
        answer:
          type: string
          example: "42"
        score:
          type: number
          example: 5
        scoringStatus:
          type: string
          nullable: true
          example: "done"
        memo:
          type: string
          example: "丁寧に書かれていた"
      required:
        - id
        - trialId
        - questionId
        - answer
        - score
        - memo

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "メール形式が不正です"
            details:
              type: object
      required:
        - success
        - error

security:
  - BearerAuth: []

paths:
  /user/signup:
    post:
      summary: ユーザー登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "user@example.com"
                password:
                  type: string
                  example: "abcdef"
                name:
                  type: string
                  example: "Taro"
              required:
                - email
                - password
                - name
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/signin:
    post:
      summary: ログイン
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "user@example.com"
                password:
                  type: string
                  example: "abcdef"
              required:
                - email
                - password
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "jwt-token"
                      user:
                        $ref: '#/components/schemas/User'

  /user/{id}:
    get:
      summary: ユーザー情報取得
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "uuid-1234"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /qgroup:
    get:
      summary: QGroup 一覧取得 / 検索
      parameters:
        - name: title
          in: query
          schema:
            type: string
            example: "数学"
        - name: qgroupId
          in: query
          schema:
            type: string
            example: "uuid-5678"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QGroup'

  /question:
    get:
      summary: 問題取得
      parameters:
        - name: qgroupId
          in: query
          required: true
          schema:
            type: string
            example: "uuid-5678"
        - name: index
          in: query
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Question'
                      - type: array
                        items:
                          $ref: '#/components/schemas/Question'

  /trial:
    post:
      summary: Trial 作成
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "数学"
                passphrase:
                  type: string
                  example: "abc123"
                userId:
                  type: string
                  example: "uuid-1234"
              required:
                - title
                - passphrase
                - userId
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/Trial'

    get:
      summary: Trial 取得
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          schema:
            type: string
            example: "uuid-2222"
        - name: qgroupId
          in: query
          schema:
            type: string
            example: "uuid-5678"
        - name: userId
          in: query
          schema:
            type: string
            example: "uuid-1234"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Trial'
                      - type: array
                        items:
                          $ref: '#/components/schemas/Trial'

  /answer:
    post:
      summary: 回答登録
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trialId:
                  type: string
                  example: "uuid-2222"
                questionId:
                  type: string
                  example: "uuid-1111"
                answer:
                  type: string
                  example: "42"
                score:
                  type: number
                  example: 0
                memo:
                  type: string
                  example: ""
              required:
                - trialId
                - questionId
                - answer
                - score
                - memo
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "uuid-3333"

    get:
      summary: 回答一覧取得
      security:
        - BearerAuth: []
      parameters:
        - name: trialId
          in: query
          schema:
            type: string
            example: "uuid-2222"
        - name: qgroupId
          in: query
          schema:
            type: string
            example: "uuid-5678"
        - name: questionId
          in: query
          schema:
            type: string
            example: "uuid-1111"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Answer'

  /answer/{id}:
    put:
      summary: 回答更新
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "uuid-3333"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: number
                  example: 5
                scoringStatus:
                  type: string
                  example: "done"
                memo:
                  type: string
                  example: "丁寧に書かれていた"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/Answer'

  /answers/by-user:
    get:
      summary: 指定ユーザーの回答一覧
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            example: "Taro"
        - name: qgroupId
          in: query
          required: true
          schema:
            type: string
            example: "uuid-5678"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Answer'

  /answers/by-question:
    get:
      summary: 指定問題の回答一覧
      security:
        - BearerAuth: []
      parameters:
        - name: qgroupId
          in: query
          required: true
          schema:
            type: string
            example: "uuid-5678"
        - name: index
          in: query
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Answer'

  /stepq/player-answers:
    get:
      summary: 指定ユーザーの全回答取得（Helper API）
      security:
        - BearerAuth: []
      parameters:
        - name: qgroupId
          in: query
          required: true
          schema:
            type: string
            example: "uuid-5678"
        - name: userId
          in: query
          required: true
          schema:
            type: string
            example: "uuid-1234"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Answer'

  /stepq/questions-of-qgroup:
    get:
      summary: 指定 QGroup の全問題取得（Helper API）
      parameters:
        - name: qgroupId
          in: query
          required: true
          schema:
            type: string
            example: "uuid-5678"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Question'
